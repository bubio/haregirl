name: Build release archives

on:
  push:
    branches: [main, master]
    paths:
      - 'LICENSE'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'LICENSE'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux (riscv64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in Ubuntu RISC-V VM
        uses: vmactions/ubuntu-vm@v1
        with:
          release: '24.04'
          arch: riscv64
          sync: rsync
          prepare: |
            apt-get update
            apt-get install -y build-essential git scdoc libsdl2-dev zip curl python3
            HARE_REF=0.26.0 HAREC_REF=0.26.0 sh scripts/install-hare-toolchain.sh
          run: |
            sh scripts/fetch-test-roms.sh
            HAREGIRL_REQUIRE_TEST_ROMS=1 sh scripts/test.sh
            sh scripts/package.sh linux riscv64
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-linux-riscv64
          path: dist/*.zip
          if-no-files-found: error

  freebsd:
    if: ${{ false }}
    name: FreeBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            sync: rsync
            release: '14.4'
            toolchain: package
          - arch: aarch64
            sync: rsync
            release: '14.4'
            toolchain: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test and package in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: ${{ matrix.sync }}
          prepare: |
            if [ '${{ matrix.toolchain }}' = package ]; then
              pkg install -y hare-lang sdl2 zip curl python3
            else
              pkg install -y binutils git scdoc sdl2 zip
              sh scripts/install-hare-toolchain.sh
            fi
          run: |
            sh scripts/test.sh
            sh scripts/package.sh freebsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-freebsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  openbsd:
    if: ${{ false }}
    name: OpenBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release: '7.8'
          - arch: aarch64
            release: '7.8'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: |
            pkg_add binutils git scdoc sdl2 zip
            echo 'export LDFLAGS="${LDFLAGS:-} -L/usr/local/lib"' >> "$HOME/.profile"
            sh scripts/install-hare-toolchain.sh
          run: |
            LDFLAGS="-L/usr/local/lib" sh scripts/test.sh
            LDFLAGS="-L/usr/local/lib" sh scripts/package.sh openbsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-openbsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  netbsd:
    if: ${{ false }}
    name: NetBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release: '11'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: |
            sh scripts/install-netbsd-x11.sh
            pkg_add binutils git scdoc SDL2 zip
            sh scripts/install-hare-toolchain.sh
          run: |
            sh scripts/test.sh
            sh scripts/package.sh netbsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-netbsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  dragonfly:
    if: ${{ false }}
    name: DragonFlyBSD (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in DragonFlyBSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4'
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y binutils git scdoc sdl2 zip
            HARE_REF=0.26.0 HAREC_REF=0.26.0 sh scripts/install-hare-toolchain.sh
          run: |
            # Hare's DragonFly runtime passes a GNU ld script; force GNU bfd
            # rather than the system default gold linker, which rejects it.
            LDFLAGS="-fuse-ld=bfd" sh scripts/test.sh
            LDFLAGS="-fuse-ld=bfd" sh scripts/package.sh dragonfly amd64
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-dragonfly-amd64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: ${{ false }}
    needs: [linux, freebsd, openbsd, netbsd, dragonfly]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*/*.zip --clobber
