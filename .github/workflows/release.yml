name: Build release archives

on:
  push:
    branches: [main, master]
    paths:
      - 'LICENSE'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'LICENSE'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            hare_arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            hare_arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential scdoc libsdl2-dev zip
      - name: Build Hare toolchain
        run: |
          git clone --depth 1 https://github.com/omenos/mirror-qbe.git /tmp/qbe
          make -C /tmp/qbe -j"$(nproc)"
          sudo make -C /tmp/qbe install PREFIX=/usr/local
          git clone --depth 1 https://git.sr.ht/~sircmpwn/harec /tmp/harec
          cp /tmp/harec/configs/linux.mk /tmp/harec/config.mk
          make -C /tmp/harec -j"$(nproc)" ARCH=${{ matrix.hare_arch }}
          sudo make -C /tmp/harec install PREFIX=/usr/local ARCH=${{ matrix.hare_arch }}
          git clone --depth 1 https://git.sr.ht/~sircmpwn/hare /tmp/hare
          cp /tmp/hare/configs/linux.mk /tmp/hare/config.mk
          make -C /tmp/hare -j"$(nproc)" ARCH=${{ matrix.hare_arch }}
          sudo make -C /tmp/hare install PREFIX=/usr/local ARCH=${{ matrix.hare_arch }}
      - name: Test and package
        run: |
          ./scripts/fetch-test-roms.sh
          HAREGIRL_REQUIRE_TEST_ROMS=1 ./scripts/test.sh
          ./scripts/package.sh linux ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  freebsd:
    name: FreeBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            sync: rsync
            release: '14.4'
            toolchain: package
          - arch: aarch64
            sync: rsync
            release: '14.4'
            toolchain: source
          - arch: riscv64
            sync: scp
            # FreeBSD 14 does not publish a riscv64 pkg bootstrap.  The
            # current 15-series image provides the package infrastructure
            # needed to bootstrap Hare and SDL2 from source/packages.
            release: '15.1'
            toolchain: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test and package in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: ${{ matrix.sync }}
          prepare: |
            if [ '${{ matrix.toolchain }}' = package ]; then
              pkg install -y hare-lang sdl2 zip curl python3
            else
              pkg install -y binutils git scdoc sdl2 zip
              sh scripts/install-hare-toolchain.sh
            fi
          run: |
            sh scripts/test.sh
            sh scripts/package.sh freebsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-freebsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  openbsd:
    name: OpenBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release: '7.8'
          - arch: aarch64
            release: '7.8'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: |
            pkg_add binutils git scdoc sdl2 zip
            echo 'export LDFLAGS="${LDFLAGS:-} -L/usr/local/lib"' >> "$HOME/.profile"
            sh scripts/install-hare-toolchain.sh
          run: |
            LDFLAGS="-L/usr/local/lib" sh scripts/test.sh
            LDFLAGS="-L/usr/local/lib" sh scripts/package.sh openbsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-openbsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  netbsd:
    name: NetBSD (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release: '11'
          - arch: aarch64
            release: '11'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in NetBSD VM
        uses: vmactions/netbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          sync: rsync
          prepare: |
            sh scripts/install-netbsd-x11.sh
            pkg_add binutils git scdoc SDL2 zip
            sh scripts/install-hare-toolchain.sh
          run: |
            sh scripts/test.sh
            sh scripts/package.sh netbsd ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-netbsd-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  dragonfly:
    name: DragonFlyBSD (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test and package in DragonFlyBSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4'
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y binutils git scdoc sdl2 zip
            HARE_REF=0.26.0 HAREC_REF=0.26.0 sh scripts/install-hare-toolchain.sh
          run: |
            # Hare's DragonFly runtime passes a GNU ld script; force GNU bfd
            # rather than the system default gold linker, which rejects it.
            LDFLAGS="-fuse-ld=bfd" sh scripts/test.sh
            LDFLAGS="-fuse-ld=bfd" sh scripts/package.sh dragonfly amd64
      - uses: actions/upload-artifact@v4
        with:
          name: haregirl-dragonfly-amd64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [linux, freebsd, openbsd, netbsd, dragonfly]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Attach archives to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*/*.zip --clobber
